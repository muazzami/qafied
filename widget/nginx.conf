server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin *;

    location /widget.js {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
